# docker-compose.dev.yml
# Uso: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Este archivo SOBREESCRIBE únicamente el servicio erp-frontend para modo desarrollo.
services:
  erp-frontend:
    build:
      context: ./frontend-erp
      dockerfile: Dockerfile.dev
      shm_size: '256mb'
    shm_size: '256mb'
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_TENANT_ID=test
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend-erp:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
