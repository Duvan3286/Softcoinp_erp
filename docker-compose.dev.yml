# docker-compose.dev.yml
# Uso: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Este archivo SOBREESCRIBE únicamente el servicio erp-frontend para modo desarrollo.
# Principios aplicados:
#   - SRP : cada archivo compose tiene una responsabilidad (producción vs. dev).
#   - OCP : el compose base no se modifica; se extiende con este override.
#   - DRY : la definición de los demás servicios (db, backend) vive solo en el base.
#
# Truco node_modules volume:
#   Al montar "./frontend-erp:/app" el volumen anónimo "frontend_node_modules"
#   apuntado a "/app/node_modules" tiene precedencia sobre el bind-mount, de modo
#   que los binarios nativos compilados en la imagen NO se sobreescriben con los del
#   host (que podrían faltar o ser binarios de Windows).

services:
  erp-frontend:
    build:
      context: ./frontend-erp
      dockerfile: Dockerfile.dev
      shm_size: '256mb'
    shm_size: '256mb'
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5005/api
      - NEXT_PUBLIC_TENANT_ID=test
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend-erp:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
